name: Build DriftIsland

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# 逐文件推送会触发一串 run。这里让它们排队(不互相取消), 保证有一个能跑完;
# 注意 cancel-in-progress 必须为 false —— 设 true 时每个新 run 都会掐掉上一个,
# 结果是"全都 cancelled, 一个产物都没有"(2.6.10 踩过的坑)。
concurrency:
  group: driftisland-build
  cancel-in-progress: false

jobs:
  build:
    # 2026-11-02 macOS 14 runner 退役, 期间处于 brownout(任务在启动前被撤销);
    # 换 macos-15, 构建工具链(brew/theos/ldid)完全一致。
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from control
        run: echo "VERSION=$(awk '/^Version:/{print $2; exit}' control)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: brew install ldid dpkg

      - name: Install Theos (standard)
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iPhoneOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          # 2026-11: 上游 theos/sdks 的 release 频繁 504, 构建经常卡在这一步。
          # 仓库自带的 sdk-cache release 作首选源, 上游只作兜底。
          PRIMARY="https://github.com/abgg332/driftisland-pub/releases/download/sdk-cache/iPhoneOS16.5.sdk.tar.xz"
          FALLBACK="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"
          ok=0
          for URL in "$PRIMARY" "$FALLBACK" "$PRIMARY" "$FALLBACK"; do
            echo "== SDK 下载 $URL"
            if curl -fL --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o /tmp/sdk.tar.xz "$URL" \
               && tar -tJf /tmp/sdk.tar.xz >/dev/null 2>&1; then
              ok=1; break
            fi
            rm -f /tmp/sdk.tar.xz
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "SDK 下载失败, 稍后重跑"; exit 1; fi
          tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"
          ls "$THEOS/sdks"

      # 无根 rootless：arm64 + arm64e（多巴胺等无根越狱，装 /var/jb）
      - name: Build rootless package
        run: |
          rm -rf .theos obj packages prefs/.theos helper/.theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS="arm64 arm64e"
          mv packages/*.deb "packages/DriftIsland-${VERSION}-无根rootless-arm64-arm64e.deb"

      - name: Upload rootless package
        uses: actions/upload-artifact@v4
        with:
          name: driftisland-rootless
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30

      # 隐根 roothide：arm64e（RootHide Bootstrap，原生编译免转换）
      - name: Reinstall Theos (roothide fork)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf ~/theos "$THEOS"
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build roothide package
        run: |
          rm -rf .theos obj packages prefs/.theos helper/.theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e
          mv packages/*.deb "packages/DriftIsland-${VERSION}-RootHide原生-arm64e.deb"

      - name: Upload roothide package
        uses: actions/upload-artifact@v4
        with:
          name: driftisland-roothide
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
